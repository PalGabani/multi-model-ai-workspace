name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: multimodel
          POSTGRES_USER: multimodel
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multimodel -d multimodel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PYTHONPATH: backend
      DATABASE_URL: postgresql+asyncpg://multimodel:test-password@localhost:5432/multimodel
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: test
      OPENAI_API_KEY: ""
      PROVIDER_CONFIGS_JSON: "{}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m alembic -c backend/alembic.ini upgrade head
      - run: ruff check backend/app backend/tests backend/alembic
      - run: pytest backend/tests
